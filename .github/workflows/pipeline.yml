name: MLOps End-to-End Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write   # allows auto-push to main

jobs:
  ml_pipeline:
    runs-on: ubuntu-latest

    steps:

    # 1️⃣ Get code from GitHub
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: true

    # 2️⃣ Setup Python
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    # 3️⃣ Install required libraries
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4️⃣ Data Ingestion
    - name: Data Ingestion
      run: python src/data_ingestion.py

    # 5️⃣ Data Validation
    - name: Data Validation
      run: python src/data_validation.py

    # 6️⃣ Data Preprocessing
    - name: Data Preprocessing
      run: python src/data_preprocessing.py

    # 7️⃣ Feature Engineering
    - name: Feature Engineering
      run: python src/feature_engineering.py

    # 8️⃣ Model Training
    - name: Model Training
      run: python src/model_training.py

    # 9️⃣ Model Evaluation
    - name: Model Evaluation
      run: python src/model_evaluation.py

    # 🔟 Auto Commit & Push to main
    - name: Commit and Push Changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git add artifacts/ reports/ || true

        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Automated ML pipeline update [skip ci]"
          git push origin main
        fi
